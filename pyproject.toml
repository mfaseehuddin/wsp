[project]
name = "wsp"
version = "0.1.0"
description = "Weight space programming: generating and explaining neural network weights without training"
readme = "README.md"
authors = [
    { name = "Muhammad Faseeh Ud Din", email = "mfaseehuddin2001@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "torch>=2.15.0",
]

[project.scripts]
wsp = "wsp:main"
wsp-pong = "wsp.pong.harness:main"
wsp-support = "wsp.support.harness:main"
wsp-bot = "wsp.bot.harness:main"
wsp-gen = "wsp.gen.harness:main"
wsp-x = "wsp.stage_x.lab:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
extend-exclude = ["experiments/*/agents"]

[tool.ruff.lint.per-file-ignores]
"src/wsp/bot/kb.py" = ["B023"]  # per-conversation closures are called inside the loop  # agent-written code, kept as delivered
